name: Feature request
description: Suggest a practical improvement to the NPC generator
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is difficult today?
      description: Describe the problem in a real NPC-generation workflow.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Suggested improvement
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives (optional)