name: Bug report
description: Report a reproducible problem in Black Flag NPC Generator
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: foundry
    attributes:
      label: Foundry VTT version
      placeholder: "14.x"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Black Flag Roleplaying system version
      placeholder: "3.x"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the smallest set of steps that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant errors and screenshots (optional)
      description: Remove names, secrets, and private campaign data from logs before sharing.